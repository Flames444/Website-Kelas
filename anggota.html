<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Website Anggota Kelas</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* Style lainnya tetap sama */

  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 0;
  }

  header {
    background-color: #2c3e50;
    color: #fff;
    padding: 20px;
    text-align: center;
  }

  nav {
    background-color: #34495e;
    display: flex;
    justify-content: center;
    padding: 10px 0;
  }

  nav a {
    color: #ecf0f1;
    text-decoration: none;
    margin: 0 15px;
    padding: 8px 16px;
    border-radius: 4px;
    transition: background-color 0.3s;
  }

  nav a:hover {
    background-color: #1abc9c;
  }

  .container {
    max-width: 800px;
    margin: 30px auto;
    padding: 20px;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #2c3e50;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    padding: 12px;
    border: 1px solid #ccc;
    text-align: left;
  }

  th {
    background-color: #ecf0f1;
  }

  /* Style footer */
  footer {
    background-color: #2c3e50;
    color: #ecf0f1;
    text-align: center;
    padding: 15px 0;
    margin-top: 40px;
  }

  /* Responsiveness */
  @media(max-width: 768px) {
    body {
      font-size: 14px;
    }
  }
</style>
</head>
<body>
<header>

<nav>

    <a href="inventaris.html">Inventaris</a>
    <a href="anggota.html">Anggota Kelas</a>
</nav>
<div class="container">

      <tbody>

      </tbody>
    </table>
</div>

  ];

  const tbody = document.querySelector("#siswaTable tbody");

    const row = tbody.insertRow();
    const cellNo = row.insertCell(0);

    cellNo.textContent = i + 1;
    cellNama.textContent = namaSiswa[i % namaSiswa.length];
  }
</script>
